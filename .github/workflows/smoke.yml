name: Smoke Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: bash -n scripts/codex-toggle

      - name: Run smoke tests
        run: bash tests/smoke.sh
